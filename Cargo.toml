[package]
name = "git-vault"
version = "0.2.0"
edition = "2021"
description = "Manage multiple git identities and credentials per command, aws-vault style"
repository = "https://github.com/chungquantin/git-vault"
readme = "README.md"
rust-version = "1.75"

[[bin]]
name = "git-vault"
path = "src/main.rs"

[dependencies]
age = "0.11"
anyhow = "1"
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shlex = "1"
toml = "0.8"
ureq = { version = "2.10", features = ["json"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dev-dependencies]
tempfile = "3"
